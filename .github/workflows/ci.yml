name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows has no supported native build yet: leyline-raw's build.rs finds
    # LibRaw via pkg-config only (ADR 0004 forbids static-linking around
    # that), and the project's actual Windows deliverable is cross-compiled
    # from Linux with a hand-built mingw LibRaw instead (see
    # packaging/windows/build-nsis.sh) — there is no vcpkg/pkg-config wiring
    # for a native MSVC build yet. Keep the leg in the matrix so it's not
    # forgotten, but don't fail the whole workflow on it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
