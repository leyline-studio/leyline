[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/leyline-studio/leyline"
rust-version = "1.85"

[workspace.dependencies]
leyline-core = { path = "crates/leyline-core" }
leyline-raw = { path = "crates/leyline-raw" }
leyline-catalog = { path = "crates/leyline-catalog" }
leyline-preview = { path = "crates/leyline-preview" }
leyline-color = { path = "crates/leyline-color" }
leyline-lens = { path = "crates/leyline-lens" }
leyline-tether = { path = "crates/leyline-tether" }
leyline-map = { path = "crates/leyline-map" }
leyline-export = { path = "crates/leyline-export" }
leyline-engine = { path = "crates/leyline-engine" }
leyline-sdk = { path = "crates/leyline-sdk" }

blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
jpeg-encoder = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
cc = "1"
pkg-config = "0.3"
png = "0.18"
slint = "1.13"
slint-build = "1.13"
tiff = "0.10"
image-webp = "0.2"
lcms2 = "6.1"
bytemuck = "1.20"
printpdf = { version = "0.12", default-features = false }
ravif = "0.11"
rgb = "0.8"
criterion = "0.5"
rayon = "1"
lensfun = "0.7"
gphoto2 = "3"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
sys-locale = "0.3"
directories = "6"
rfd = "0.15"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `overflow-checks` and `debug-assertions` default to off in release, same as
# every other Cargo project — spelled out here so that's a decision, not an
# accident. The develop pipeline's per-pixel loops (process1-5) are the
# reason: those checks add a branch to every arithmetic op in code Phase 7
# spent real effort tightening (ADR 0012), and the values they'd guard —
# image width/height — come from LibRaw/the `image` crate already clamped to
# real sensor sizes, nowhere near `usize` overflow territory. Revisit only if
# a size computation moves to genuinely untrusted input (e.g. a user-supplied
# dimension) that isn't bounded that way.
[profile.release]
overflow-checks = false
