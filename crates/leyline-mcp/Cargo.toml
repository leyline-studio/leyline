[package]
name = "leyline-mcp"
description = "Model Context Protocol server over the Leyline SDK (ADR 0154)."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The SDK and nothing below it: a tool reaching past the façade does not
# compile (ADR 0154 §2). `leyline-engine` must never appear here.
[dependencies]
leyline-sdk.workspace = true
base64 = "0.22"
image.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
