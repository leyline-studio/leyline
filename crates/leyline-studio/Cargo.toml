[package]
name = "leyline-studio"
description = "Leyline Studio desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
leyline-sdk.workspace = true
# `unstable-winit-030` is Slint's own escape hatch for exactly this: reaching
# the underlying winit window to query the primary monitor's resolution so
# the initial window size can be screen-relative instead of a hardcoded
# constant (see `size_window_to_screen` in `src/main.rs`). It's marked
# "unstable" only in the sense that it may move on a future winit major
# bump, not that the API itself is flaky — it's Slint's documented,
# officially supported way to reach winit.
slint = { workspace = true, features = ["unstable-winit-030"] }
sys-locale.workspace = true
directories.workspace = true
rfd.workspace = true
serde_json.workspace = true
image.workspace = true

[build-dependencies]
slint-build.workspace = true
embed-resource = "3.0"

[features]
# Pure forwarding of `leyline-engine/tether`, so the Windows packaging script
# can turn the backend off from the top of the tree (Cargo can only select
# features on the package it is asked to build, never on a transitive
# dependency). Nothing in this crate's own surface changes either way.
default = ["tether"]
tether = ["leyline-sdk/tether"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# cargo-packager configuration (ADR 0019 — docs/adr/0019-distribution-i18n.md).
#
# cargo-packager only auto-detects binaries/out-dir/version by scanning
# `[package.metadata.packager]` in workspace Cargo.toml files (it does not do
# that merge when pointed at a standalone config via `-c`), so the config
# lives here rather than as a file under `packaging/`. Per the ADR, actual
# assets (icons, NSIS-specific resources, per-OS build scripts) stay under
# `packaging/` — only pointers to them live in this table.
#
# Relative paths below are resolved by cargo-packager relative to *this*
# Cargo.toml's directory (`crates/leyline-studio/`), not the repo root or
# the invoking shell's cwd — cargo-packager chdirs there before reading the
# config. Hence the `../../` prefix on every path.
[package.metadata.packager]
product-name = "Leyline Studio"
identifier = "org.leyline.studio"
homepage = "https://github.com/leyline-studio/leyline"
license-file = "../../LICENSE"
# Regenerated (plain downscale, source already a tight transparent-bg crop)
# from the brand source `assets/leyline-studio-logo.png` whenever that
# master asset changes — see `icon:` on `StudioWindow` in `ui/studio.slint`
# for the same source used as the in-app window/taskbar icon, and
# `windows-manifest.rc` / `crates/leyline-cli/windows-icon.rc` for the .exe
# icon. `assets/leyline-studio-logo.png` is the single brand master for
# every icon size; the wide wordmark `assets/leyline-studio.png` covers
# README and the About dialog, where there is room for the full lockup. A
# square wordmark badge was tried as the icon once and found illegible at
# 16-32px (see commit 3e704146), which is why the logo — not a badge — is
# the source here.
icons = [
    "../../packaging/icons/32x32.png",
    "../../packaging/icons/128x128.png",
    "../../packaging/icons/128x128@2x.png",
    "../../packaging/icons/icon.png",
]

# LibRaw is always dynamically linked (ADR 0004, LGPL substitution
# obligation) — on Linux the .so is a system package the user already has
# (or installs alongside Leyline), but Windows has no equivalent convention,
# so `libraw_r-23.dll` must ship next to the exe. It's a build artifact of
# the cross-compile (see `packaging/windows/build-nsis.sh`), not committed —
# `packaging/windows/vendor/` is gitignored and populated right before
# packaging. This `resources` entry is consumed by the nsis/wix/app
# packagers only (cargo-packager's appimage/deb/pacman builders never read
# `resources` at all), and is a glob that resolves to nothing when the
# vendor DLL hasn't been built yet — safe no-op for the Linux AppImage build.
# The macOS `.app` packager *does* read `resources` too; if a Windows DLL
# happens to sit in the vendor dir when someone eventually builds `-f dmg`,
# it would get bundled there as well — harmless dead weight, but worth a
# `rm -rf packaging/windows/vendor` before a macOS build until this is
# scoped more tightly (cargo-packager 0.11.8 has no per-format resources).
resources = ["../../packaging/windows/vendor/*.dll"]

# Linux: portable AppImage is the first deliverable (ADR 0019). `.deb` may
# come later; no config needed for it yet.
[package.metadata.packager.linux]
generate-desktop-entry = true

# Windows: NSIS installer, classic wizard with a folder-choice page. The
# bundled default `.nsi` template already includes MUI_PAGE_DIRECTORY
# unconditionally, so no custom template is needed for that requirement.
[package.metadata.packager.nsis]
installer-icon = "../../packaging/icons/icon.ico"
installer-mode = "currentUser"

# macOS: .app bundled into a .dmg, drag-to-/Applications — cargo-packager's
# default dmg layout already does this; sizing/positions below are cosmetic.
[package.metadata.packager.dmg]
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }
