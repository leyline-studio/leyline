[package]
name = "leyline-cli"
description = "Command-line client for the Leyline engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
leyline-sdk.workspace = true
# One command takes a stored `LocalAdjustment` verbatim as its argument
# (ADR 0049 §4), so the CLI reads the very JSON `settings_json` holds rather
# than inventing a second grammar for the same structure.
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
embed-resource = "3.0"

[features]
# Pure forwarding of `leyline-engine/tether`, so the Windows packaging script
# can turn the backend off from the top of the tree (Cargo can only select
# features on the package it is asked to build, never on a transitive
# dependency). Nothing in this crate's own surface changes either way.
default = ["tether", "heif"]
tether = ["leyline-sdk/tether"]
# Same forwarding for the system HEIF decoder (ADR 0114).
heif = ["leyline-sdk/heif"]

[dev-dependencies]
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
