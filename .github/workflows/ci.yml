name: CI

# Tags, pull requests, and a manual button — each answering a different
# question. `make check` is the gate before every commit (see CLAUDE.md /
# docs/contributing.md), so running the same three steps again on every push
# to main bought a second Linux opinion and little else. What CI alone can
# say is whether macOS and Windows still build — a question that matters at
# a release, not at a commit.
#
# A pull request runs the Linux `check` leg alone: an external contributor's
# `make check` ran on a machine the reviewer cannot see, and Linux is where
# the gate lives. The full matrix and the deliverables stay a release
# question — a PR does not wait on a macOS runner to be reviewable.
#
# `workflow_dispatch` is the escape hatch: anything touching a system
# dependency, a build script or the toolchain deserves a manual run before
# it waits for a tag.
#
# Windows is not a matrix leg. A *native* Windows build cannot work today
# and never could: `leyline-raw` finds LibRaw through pkg-config only
# (ADR 0004 forbids static-linking around that) and `leyline-tether` finds
# libgphoto2 the same way, neither of which exists on a Windows runner — so
# that leg failed every run since it was added, `continue-on-error` hiding
# it behind a red cross nobody could act on. What ships on Windows is
# cross-compiled from Linux (ADR 0019, `packaging/windows/build-nsis.sh`),
# so that is what the `windows-cross` job below builds: the real deliverable,
# and a result that can actually be green.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The pinned decoder, for every leg (ADR 0086). Left to the package
  # managers this was three decoders for one release — Ubuntu 0.21.2, the
  # cross-built Windows prefix 0.21.4, Homebrew 0.22.2, the last a different
  # minor version. LibRaw is what turns a RAW into pixels, and
  # `docs/pipeline.md` §5.1 counts it among the terms of the bit-for-bit
  # promise, so it is built from source here rather than installed.
  # 0.22.2 since 2026-09-15, for 0.22.1's security fixes (ADR 0086 §7).
  LIBRAW_VERSION: 0.22.2
  # Same logic for the packaging chain: one cargo-packager, every leg.
  PACKAGER_VERSION: 0.11.8

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # On a pull request, Linux only — see the header.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Pinned to a version, not the moving `v2`: what matters here is that
      # it runs on node24 (GitHub deprecated node20 runners on 2025-09-19),
      # and a moving major tag is not a promise about that.
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # nasm: rav1e (leyline-export's AVIF encoder) hard-fails its build.rs
        # without it rather than falling back to a pure-Rust path.
        # libgphoto2-dev: leyline-tether (ADR 0038). Found through pkg-config
        # only, like LibRaw — its absence fails the *build*, which surfaces on
        # whichever step compiles first (Clippy), not as a lint error.
        #
        # No libraw-dev: the pinned LibRaw is built below instead. Installing
        # it as well would only add a second copy for pkg-config to find.
        run: sudo apt-get update && sudo apt-get install -y libgphoto2-dev libheif-dev nasm

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # No libraw: the pinned one is built below. Homebrew ships its own,
          # on its own schedule, which is not a pin.
          brew install libgphoto2 libheif nasm
          # Homebrew's libraw_r.pc hardcodes `-lstdc++` in its Libs line
          # (LibRaw is C++), but current Xcode/macOS SDKs only ship libc++ —
          # there's no standalone libstdc++.dylib/.tbd anymore, so the
          # linker fails with "library 'stdc++' not found". Shim it: symlink
          # libc++'s stub as libstdc++ in a directory added to LIBRARY_PATH,
          # which clang (the linker driver rustc invokes) reads for extra
          # library search paths.
          mkdir -p "$HOME/lib-shim"
          ln -sf "$(xcrun --show-sdk-path)/usr/lib/libc++.tbd" "$HOME/lib-shim/libstdc++.tbd"
          echo "LIBRARY_PATH=$HOME/lib-shim:$LIBRARY_PATH" >> "$GITHUB_ENV"

      # Same tag, same recipe, on both legs — this is what makes the decoder
      # one thing rather than whatever each runner's package manager offers.
      # `PKG_CONFIG_PATH` puts it ahead of anything else; `LD_LIBRARY_PATH`
      # (`DYLD_*` on macOS) matters just as much, because 0.22.x releases
      # share the soname `libraw_r.so.25` and the loader would otherwise be
      # free to pick a different copy at run time.
      - name: Cache the pinned LibRaw
        id: libraw-pin
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libraw-prefix
          key: libraw-pin-${{ env.LIBRAW_VERSION }}-${{ runner.os }}

      - name: Build the pinned LibRaw
        if: steps.libraw-pin.outputs.cache-hit != 'true'
        run: |
          curl -sLO https://github.com/LibRaw/LibRaw/archive/refs/tags/${LIBRAW_VERSION}.tar.gz
          tar xzf ${LIBRAW_VERSION}.tar.gz
          cd LibRaw-${LIBRAW_VERSION}
          autoreconf -fiv
          ./configure --prefix="${{ runner.temp }}/libraw-prefix" \
                      --disable-examples --disable-static --enable-shared
          make -j2 && make install

      - name: Point the build at the pinned LibRaw
        run: |
          echo "PKG_CONFIG_PATH=${{ runner.temp }}/libraw-prefix/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${{ runner.temp }}/libraw-prefix/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${{ runner.temp }}/libraw-prefix/lib:$DYLD_FALLBACK_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The Windows deliverable, built the way it is actually shipped
  # (ADR 0019): x86_64-pc-windows-gnu, no tethering — libgphoto2 has no
  # cross-compilable Windows build, the gap ADR 0038 records — and a LibRaw
  # cross-built here because Debian/Ubuntu ship no mingw package for it.
  # The recipe is the one written in the header of
  # `packaging/windows/build-nsis.sh`; keep the two in step.
  windows-cross:
    name: windows (cross-compiled)
    # A deliverable, not a gate: release question, so not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # LIBRAW_VERSION and PACKAGER_VERSION are inherited from the workflow
      # env: one pin, every leg.
      LIBRAW_MINGW_PREFIX: /opt/leyline/libraw-mingw
    steps:
      - uses: actions/checkout@v7

      # No `targets:` here, and it is not an oversight: `rust-toolchain.toml`
      # pins the toolchain to an exact version (docs/pipeline.md §5.2 makes
      # the compiler an input of the render), so a target added to `stable`
      # is added to a toolchain nothing in this repository ever uses — the
      # build then fails with `can't find crate for core`. The target is
      # installed below, under whichever toolchain the pin selects.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Add the Windows target to the pinned toolchain
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install cross toolchain
        # nsis: `makensis` emits a Windows installer from Linux, no Windows
        # host needed. libz-mingw-w64-dev: the mingw zlib pkg-config file
        # LibRaw's ./configure needs. nasm: rav1e's build.rs hard-fails
        # without it.
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis nasm libz-mingw-w64-dev autoconf automake libtool

      - name: Cache the cross-built LibRaw
        id: libraw-cache
        # v6: v4 still targets node20, which GitHub deprecated on
        # 2025-09-19 and now force-runs on node24 with a warning.
        uses: actions/cache@v6
        with:
          path: ${{ env.LIBRAW_MINGW_PREFIX }}
          key: libraw-mingw-${{ env.LIBRAW_VERSION }}-${{ runner.os }}

      - name: Cross-build LibRaw
        if: steps.libraw-cache.outputs.cache-hit != 'true'
        # `--disable-lcms` keeps the host's pkg-config out of it (leyline-color
        # does its own ICC handling); `--disable-static --enable-shared`
        # because ADR 0004 requires LibRaw to stay dynamically linked.
        run: |
          curl -sLO https://github.com/LibRaw/LibRaw/archive/refs/tags/${LIBRAW_VERSION}.tar.gz
          tar xzf ${LIBRAW_VERSION}.tar.gz
          cd LibRaw-${LIBRAW_VERSION}
          autoreconf -fiv
          PKG_CONFIG_LIBDIR=/usr/x86_64-w64-mingw32/lib/pkgconfig \
            ./configure --host=x86_64-w64-mingw32 --prefix=${LIBRAW_MINGW_PREFIX} \
              CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
              --disable-examples --disable-static --enable-shared --disable-lcms
          make -j"$(nproc)"
          sudo make install

      # `cargo packager` is the packaging chain (ADR 0019), and it is a
      # binary a developer installs once — nothing on a fresh runner has
      # it. Pinned to the version this project packages with, and cached as
      # a binary: compiling it from source is several minutes that have
      # nothing to do with this repository.
      - name: Cache cargo-packager
        id: packager-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-${{ env.PACKAGER_VERSION }}-${{ runner.os }}

      - name: Install cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version ${{ env.PACKAGER_VERSION }}

      - name: Build the installer
        run: bash packaging/windows/build-nsis.sh

      - name: Name what was produced
        run: ls -la target/x86_64-pc-windows-gnu/release/*-setup.exe

      # Without this the installer is described in the log and destroyed with
      # the runner. Nothing here publishes a release — the signing key lives
      # outside this repository and outside CI (ADR 0077 §1), and an unsigned
      # release would be one the updater refuses anyway. What this gives is
      # narrower and is the thing missing today: a build testable on a real
      # Windows machine, from the run's own page, with no tag and nothing
      # public. Publishing stays `packaging/release-manifest.sh`, by hand.
      #
      # `if-no-files-found: error` because the alternative is an empty
      # artifact and a green run: the build step above would have to fail
      # first, but a glob that stops matching after a rename would not.
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: leyline-studio-windows-x64
          path: target/x86_64-pc-windows-gnu/release/*-setup.exe
          if-no-files-found: error

  # The macOS deliverable, built the way the other two are: the pinned
  # LibRaw (ADR 0086) and `cargo packager`, through
  # `packaging/macos/build-dmg.sh`. This job exists because no development
  # machine runs macOS — the runner is the only macOS host the project has,
  # which is exactly the situation the windows-cross job answers for
  # Windows. Same LibRaw recipe and cache key as the macOS `check` leg, so
  # the two share one prefix.
  #
  # What this proves is that the deliverable *builds*; two things are still
  # owed and written down rather than implied: the .app links the pinned
  # dylibs by the runner's own paths (nothing yet copies them into the
  # bundle, so the .dmg is not self-contained), and no one has launched the
  # result on real hardware. `runs-on: macos-latest` is arm64 — the artifact
  # name says so.
  macos-package:
    name: macos (dmg)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # No `targets:`, same reason as windows-cross: `rust-toolchain.toml`
      # picks the toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install system dependencies
        # Same set, same reasons, and the same libstdc++ shim as the macOS
        # `check` leg above — LibRaw is C++, its .pc says `-lstdc++`, and
        # current SDKs only ship libc++.
        run: |
          brew install libgphoto2 libheif nasm
          mkdir -p "$HOME/lib-shim"
          ln -sf "$(xcrun --show-sdk-path)/usr/lib/libc++.tbd" "$HOME/lib-shim/libstdc++.tbd"
          echo "LIBRARY_PATH=$HOME/lib-shim:$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Cache the pinned LibRaw
        id: libraw-pin
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/libraw-prefix
          key: libraw-pin-${{ env.LIBRAW_VERSION }}-${{ runner.os }}

      - name: Build the pinned LibRaw
        if: steps.libraw-pin.outputs.cache-hit != 'true'
        run: |
          curl -sLO https://github.com/LibRaw/LibRaw/archive/refs/tags/${LIBRAW_VERSION}.tar.gz
          tar xzf ${LIBRAW_VERSION}.tar.gz
          cd LibRaw-${LIBRAW_VERSION}
          autoreconf -fiv
          ./configure --prefix="${{ runner.temp }}/libraw-prefix" \
                      --disable-examples --disable-static --enable-shared
          make -j3 && make install

      - name: Cache cargo-packager
        id: packager-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-${{ env.PACKAGER_VERSION }}-${{ runner.os }}

      - name: Install cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version ${{ env.PACKAGER_VERSION }}

      - name: Build the dmg
        run: LIBRAW_MACOS_PREFIX="${{ runner.temp }}/libraw-prefix" bash packaging/macos/build-dmg.sh

      - name: Name what was produced
        run: ls -la target/release/*.dmg

      # Same reasoning as the Windows installer above: without this the dmg
      # dies with the runner. Nothing here publishes a release.
      - name: Keep the dmg
        uses: actions/upload-artifact@v7
        with:
          name: leyline-studio-macos-arm64
          path: target/release/*.dmg
          if-no-files-found: error
