[package]
name = "leyline-sdk"
description = "Stable public API of the Leyline engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
leyline-catalog.workspace = true
leyline-color.workspace = true
leyline-detect.workspace = true
leyline-core.workspace = true
leyline-engine.workspace = true
leyline-export.workspace = true
leyline-map.workspace = true

[features]
# Pure forwarding of `leyline-engine/tether`, so the Windows packaging script
# can turn the backend off from the top of the tree (Cargo can only select
# features on the package it is asked to build, never on a transitive
# dependency). Nothing in this crate's own surface changes either way.
default = ["tether"]
tether = ["leyline-engine/tether"]
# Same forwarding, for the embedded world basemap (ADR 0059). Off by
# default: only a client that renders a map wants those 9 Mo.
bundled-basemap = ["leyline-engine/bundled-basemap"]

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
