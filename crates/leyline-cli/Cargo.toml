[package]
name = "leyline-cli"
description = "Command-line client for the Leyline engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
leyline-sdk.workspace = true

[build-dependencies]
embed-resource = "3.0"

[features]
# Pure forwarding of `leyline-engine/tether`, so the Windows packaging script
# can turn the backend off from the top of the tree (Cargo can only select
# features on the package it is asked to build, never on a transitive
# dependency). Nothing in this crate's own surface changes either way.
default = ["tether"]
tether = ["leyline-sdk/tether"]

[dev-dependencies]
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
