[package]
name = "leyline-engine"
description = "Leyline orchestration engine: jobs, events and rendering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
jpeg-decoder.workspace = true
image.workspace = true
kamadak-exif.workspace = true
leyline-core.workspace = true
leyline-raw.workspace = true
leyline-catalog.workspace = true
leyline-preview.workspace = true
leyline-color.workspace = true
leyline-lens.workspace = true
leyline-tether = { workspace = true, optional = true }
leyline-map.workspace = true
leyline-export.workspace = true
notify.workspace = true
png.workspace = true
rayon.workspace = true
roxmltree.workspace = true
# The frozen noise profile table is JSON (ADR 0072 §1): kept in the upstream
# shape so it can be diffed against darktable's own file rather than trusted.
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
trash.workspace = true

[features]
# On by default, so an ordinary `cargo build`/`cargo test` is unchanged.
# Turned off only by `packaging/windows/build-nsis.sh`: there is no
# cross-compilable `libgphoto2` for the mingw target (no Debian mingw
# package, weak upstream Windows support, pulls ltdl/libusb/gettext/iconv),
# and ADR 0038 already flagged Windows/macOS packaging of it as open work.
#
# The feature removes the *backend*, never the API: `tether_connect`,
# `tether_disconnect` and the tether events compile either way, so
# `leyline-sdk`'s semver surface keeps the same shape and no client — CLI,
# Studio or third party — needs to know how the engine was built.
default = ["tether"]
tether = ["dep:leyline-tether"]

# The world basemap Leyline Studio ships with (ADR 0059): ~9 Mo of tiles
# compiled into the binary. Off by default because only a client that
# *renders* a map has any use for it — the CLI and the SDK deliberately
# expose no map rendering (ADR 0040), so they would carry the weight for
# nothing. Leyline Studio turns it on through its own forwarding feature.
bundled-basemap = []

[dev-dependencies]
image.workspace = true
leyline-raw.workspace = true
tempfile.workspace = true
criterion.workspace = true
rusqlite.workspace = true
tiff.workspace = true

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "import"
harness = false

[[bench]]
name = "export"
harness = false

[lints]
workspace = true
