name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows has no supported native build yet: leyline-raw's build.rs finds
    # LibRaw via pkg-config only (ADR 0004 forbids static-linking around
    # that), and the project's actual Windows deliverable is cross-compiled
    # from Linux with a hand-built mingw LibRaw instead (see
    # packaging/windows/build-nsis.sh) — there is no vcpkg/pkg-config wiring
    # for a native MSVC build yet. Keep the leg in the matrix so it's not
    # forgotten, but don't fail the whole workflow on it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # nasm: rav1e (leyline-export's AVIF encoder) hard-fails its build.rs
        # without it rather than falling back to a pure-Rust path.
        # libgphoto2-dev: leyline-tether (ADR 0038). Found through pkg-config
        # only, like LibRaw — its absence fails the *build*, which surfaces on
        # whichever step compiles first (Clippy), not as a lint error.
        run: sudo apt-get update && sudo apt-get install -y libraw-dev libgphoto2-dev nasm

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libraw libgphoto2 nasm
          # Homebrew's libraw_r.pc hardcodes `-lstdc++` in its Libs line
          # (LibRaw is C++), but current Xcode/macOS SDKs only ship libc++ —
          # there's no standalone libstdc++.dylib/.tbd anymore, so the
          # linker fails with "library 'stdc++' not found". Shim it: symlink
          # libc++'s stub as libstdc++ in a directory added to LIBRARY_PATH,
          # which clang (the linker driver rustc invokes) reads for extra
          # library search paths.
          mkdir -p "$HOME/lib-shim"
          ln -sf "$(xcrun --show-sdk-path)/usr/lib/libc++.tbd" "$HOME/lib-shim/libstdc++.tbd"
          echo "LIBRARY_PATH=$HOME/lib-shim:$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
