<?xml version="1.0" encoding="UTF-8"?>
<!--
  Leyline placeholder app icon (still not final branding).

  Visual idea: straight converging lines meeting at a center point, read
  simultaneously as (a) ley lines — the folkloric straight alignments the
  project is named after — and (b) a rangefinder/viewfinder crosshair,
  which keeps it grounded in "this is a RAW photo editor". Four bold
  diagonals converge on a center dot inside a thin viewfinder ring; no
  fine detail, so it still reads at 16x16/32x32 (taskbar/Explorer scale).

  Regenerate the PNG/ICO set from this file with ImageMagick:
    convert -background none packaging/icons/icon.svg -resize 32x32   packaging/icons/32x32.png
    convert -background none packaging/icons/icon.svg -resize 128x128 packaging/icons/128x128.png
    convert -background none packaging/icons/icon.svg -resize 256x256 packaging/icons/128x128@2x.png
    convert -background none packaging/icons/icon.svg -resize 512x512 packaging/icons/icon.png
    convert packaging/icons/16x16.png packaging/icons/32x32.png packaging/icons/48x48.png \
            packaging/icons/128x128.png packaging/icons/256x256.png packaging/icons/icon.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="#182430"/>

  <!-- viewfinder ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#c99a3e" stroke-width="10" opacity="0.55"/>

  <!-- four converging ley lines -->
  <g stroke="#dcb04c" stroke-width="26" stroke-linecap="round">
    <line x1="104" y1="104" x2="256" y2="256"/>
    <line x1="408" y1="104" x2="256" y2="256"/>
    <line x1="104" y1="408" x2="256" y2="256"/>
    <line x1="408" y1="408" x2="256" y2="256"/>
  </g>

  <!-- convergence point -->
  <circle cx="256" cy="256" r="40" fill="#dcb04c"/>
</svg>
